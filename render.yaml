# Render Blueprint: one free web service running Jhala AI on the Blinkit Pulse model.
# Render asks for the two values marked sync: false when you create the Blueprint.
services:
  - type: web
    name: blinkit-ai-analyst
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: TENANT_ID
        value: 49e2473e-b59d-4a4e-96e9-7fb4746723a3
      - key: AZURE_CLIENT_ID
        value: 31276abc-8c3c-401d-8665-36b8358421a1
      - key: WORKSPACE_ID
        value: 23fb0004-d7de-4d93-8ec5-d1c9288793aa
      - key: SEMANTIC_MODEL_ID
        value: cedd1ba4-4f18-46fb-94a2-0cb5c8c90a3d
      - key: REPORT_ID
        value: 9ce1a4c8-c9e1-42ea-b4d5-205a2298146f
      - key: GROQ_API_KEY
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
